<!doctype html>
<meta charset="utf-8">
<title>terminal</title>
<style>
  :root { --bg:#07090f; --panel:#0b0f17; --line:#1c2431; --fg:#e8ebf0; --muted:#8a94a6; --amber:#f5b83d; --green:#3ddc84; --red:#ff5c5c; --blue:#4f8dff; }
  html, body { margin:0; width:100%; height:100%; background:var(--panel); color:var(--fg); overflow:hidden;
    font: 19px/1.45 "DejaVu Sans Mono", ui-monospace, monospace; }
  .pane { display:flex; flex-direction:column; height:100%; box-sizing:border-box; border-left:1px solid var(--line); }
  .bar { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line); color:var(--muted); font-size:16px; flex:none; }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .dot:nth-child(1) { background:var(--red) } .dot:nth-child(2) { background:var(--amber) } .dot:nth-child(3) { background:var(--green) }
  .title { margin-left:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .body { padding:14px 18px; overflow:hidden; flex:1; display:flex; flex-direction:column; justify-content:flex-end; }
  .l { white-space:pre-wrap; word-break:break-word; opacity:0; transform:translateY(4px); transition:opacity .18s ease, transform .18s ease; margin:2px 0; color:var(--muted); }
  .l.on { opacity:1; transform:none; }
  .l.phase { color:var(--fg); }
  .l.phase .tag { color:var(--amber); font-weight:700; }
  .l.ok { color:var(--green); font-weight:700; }
  .l.err { color:var(--red); font-weight:700; }
  .l.sum { color:var(--fg); }
  .cursor { display:inline-block; width:10px; height:22px; background:var(--fg); vertical-align:-4px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0 } }
</style>
<div class="pane"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title" id="title"></span></div><div class="body" id="body"></div></div>
<script>
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const body = document.getElementById("body");
  let cursor = null;
  const MAX = 26;
  window.setTitle = (t) => { document.getElementById("title").textContent = t; };
  // One verbatim log line at a time; older lines scroll off the top.
  window.push = (raw) => {
    if (cursor) cursor.remove();
    const div = document.createElement("div");
    let cls = "l";
    let html = esc(raw);
    if (/^\[E2E\] phase/.test(raw)) { cls += " phase"; html = html.replace(/^\[E2E\] (phase \d+ \w+):/, '<span class="tag">$1</span>:'); }
    else if (/ONCHAIN EXECUTION COMPLETE/.test(raw)) cls += " ok";
    else if (/Error|revert|Failure/.test(raw)) cls += " err";
    else if (/^(===|oracle|closure|bob|erin|suppliers|backstop|     )/.test(raw)) cls += " sum";
    div.className = cls;
    div.innerHTML = html;
    body.appendChild(div);
    requestAnimationFrame(() => div.classList.add("on"));
    while (body.children.length > MAX) body.removeChild(body.firstChild);
    cursor = document.createElement("div");
    cursor.className = "l on";
    cursor.innerHTML = '<span class="cursor"></span>';
    body.appendChild(cursor);
  };
  window.push("$ forge script script/E2E.s.sol --rpc-url robinhood_testnet --broadcast --slow");
</script>
