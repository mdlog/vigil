[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"        # Morpho Blue v1.0.0 mem-pin 0.8.19; OZ 4.9 kompatibel
evm_version = "paris"          # tanpa PUSH0 — aman untuk semua L2 berbasis Nitro
optimizer = true
optimizer_runs = 200
remappings = [
  "morpho-blue/=lib/morpho-blue/src/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 48
depth = 24
fail_on_revert = false

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"
